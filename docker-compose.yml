# Local production-like run: `docker compose up --build`, then open http://localhost:8080.
services:
  app:
    build:
      context: .
      dockerfile: deployment/Dockerfile
      args:
        NEXT_PUBLIC_APP_VERSION: dev
        NEXT_PUBLIC_APP_URL: https://mempoolxch.space
    image: mempool-xch:local
    ports:
      - "8080:80"
    restart: unless-stopped
