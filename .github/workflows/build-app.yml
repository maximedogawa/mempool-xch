name: Build App (Docker)

# Builds (and, outside pull requests, pushes) the app image to ghcr.io. Pull requests only
# build the image, to catch Dockerfile/build breakage before merge, without publishing.
# Deploying is a one-time `once deploy` on the server (deployment/README.md); ONCE then
# auto-updates from the registry.

on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (empty => latest)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG_IN="${{ github.event.inputs.tag }}"
            TAG="${TAG_IN:-latest}"
          fi
          COMMIT_SHA="${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployment/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.tag }}
            NEXT_PUBLIC_COMMIT_SHA=${{ steps.meta.outputs.commit_sha }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://mempoolxch.space' }}
