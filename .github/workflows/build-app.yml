name: Build App (Docker)

# Builds the app image and pushes it to ghcr.io on a published release and on a manual
# workflow_dispatch run. `:latest` moves with every push except a GitHub prerelease, because
# the server auto-updates from it: deploying is a one-time `once deploy` (deployment/README.md).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (empty => latest)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        # Untrusted strings (tag names, dispatch input) reach the script as env vars, never
        # interpolated into it, and must be a valid Docker tag.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then TAG="$REF_NAME"; else TAG="${TAG_INPUT:-latest}"; fi
          if ! printf '%s' "$TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::'$TAG' is not a valid image tag"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "commit_sha=${COMMIT_SHA:0:7}"
            echo "tags<<EOF"
            echo "$IMAGE:$TAG"
            if [ "$PRERELEASE" != "true" ] && [ "$TAG" != "latest" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.tag }}
            NEXT_PUBLIC_COMMIT_SHA=${{ steps.meta.outputs.commit_sha }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://mempoolxch.space' }}
